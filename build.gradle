plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.41.2.1'
}

javafx {
    version = '21'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainModule.set('com.market4cast')
    mainClass.set('com.market4cast.Market4castApp')
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

// Placeholder for native packaging task
tasks.register('packageWin', Exec) {
    dependsOn tasks.named('build')
    commandLine 'jpackage', 
                '--name', 'Market4cast', 
                '--input', 'build/libs', 
                '--main-jar', "Market4cast-${project.version}.jar", 
                '--main-class', 'com.market4cast.Market4castApp', 
                '--type', 'exe', 
                '--win-dir-chooser', 
                '--win-menu', 
                '--win-shortcut'
}
